name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: desktop-app/requirements.txt
      - run: python -m pip install -r desktop-app/requirements.txt
      - run: python -m unittest discover -s desktop-app/tests -p "test_*.py" -v
      - run: python tools/check_repository.py

  firmware-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python firmware/esp32/MoldSense/tools/run_tests.py --compiler g++
      - name: Check actual firmware serialization against the desktop fixture
        run: cmp firmware/esp32/MoldSense/build/tests/firmware_readings.ndjson desktop-app/tests/fixtures/firmware_readings.ndjson
