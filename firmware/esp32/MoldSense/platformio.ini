[platformio]
src_dir = .
lib_dir = vendor
[env:esp32dev]
platform = espressif32@6.10.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_src_filter = +<MoldSense.ino> +<src/> -<tests/> -<vendor/> -<build/>
build_flags = -std=gnu++17
lib_ldf_mode = deep+
; Arduino-ESP32 3.3.10 is the verified build. This PIO platform uses its own
; Arduino core and requires a separate compile/bench check before release.
